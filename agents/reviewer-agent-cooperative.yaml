# Reviewer agent — COOPERATIVE version: the gateway is an OpenAI-compatible LLM router.
#
# The reviewer reads the writer's open poem PRs, judges each poem with the LLM, then comments and
# (on approval) MERGES. It sends OpenAI chat-completions requests to the GATEWAY (LLM_ENDPOINT) with
# NO credential; the gateway steers the model/provider (Bedrock today) and injects the token. The
# GitHub MCP calls likewise carry no token. The agent is provider-agnostic — it never names Bedrock.
#
# Runs as the reviewer ServiceAccount (identity spiffe://.../ns/reviewer-agent/sa/reviewer-agent) —
# the identity the gateway routes to the approve+merge credential and (forward-looking) authorizes
# for the merge-PR MCP tool. That authority is what distinguishes it from the writer.
#   kubectl apply -f reviewer-agent-sa.yaml -f reviewer-agent-cooperative.yaml
#   kubectl -n reviewer-agent logs deploy/reviewer-agent-cooperative -f
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviewer-agent-cooperative
  namespace: reviewer-agent
  labels:
    app: reviewer-agent-cooperative
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviewer-agent-cooperative
  template:
    metadata:
      labels:
        app: reviewer-agent-cooperative
    spec:
      serviceAccountName: reviewer-agent
      # The image is single-arch (IMAGE_PLATFORM, default linux/amd64); keep the pod on matching nodes.
      nodeSelector:
        kubernetes.io/arch: <IMAGE_ARCH>
      containers:
        - name: agent
          # <REVIEWER_IMAGE> is rendered by install.sh (built + pushed by agents/build-images.sh).
          image: <REVIEWER_IMAGE>
          imagePullPolicy: Always
          env:
            - name: GITHUB_OWNER
              value: "<GITHUB_OWNER>"
            - name: GITHUB_REPO
              value: "<GITHUB_REPO>"
            - name: LIST_INTERVAL_SECONDS
              value: "60"
            - name: MCP_ENDPOINT
              value: "http://api.githubcopilot.com/mcp/"
            # Only review PRs on the writer's poem branches; how approved PRs are merged.
            - name: POEM_BRANCH_PREFIX
              value: "poem/"
            - name: MERGE_METHOD
              value: "squash"
            - name: LLM_MODE
              value: "cooperative"
            # The gateway's own Service as an OpenAI-compatible endpoint; the gateway steers the
            # model and injects the credential. No creds here. VERIFY the Service name:
            #   kubectl -n agentgateway-system get svc   (the one on :80; derived from Gateway 'egress')
            - name: LLM_ENDPOINT
              value: "http://egress.agentgateway-system.svc.cluster.local/v1"
            # Left empty on purpose: an empty model lets the gateway's backend pick, including its
            # priority-group failover (Sonnet -> Nova). Set it only to request a specific model.
            - name: COOPERATIVE_MODEL
              value: ""
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Sized for the Strands runtime: strands-agents pulls in boto3, the OpenAI client, and the
          # OpenTelemetry SDK, so the resident footprint is a few hundred MB. 128Mi OOMKills on import.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
