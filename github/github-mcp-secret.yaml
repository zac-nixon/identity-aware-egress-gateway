# Per-agent provider credentials for the GitHub MCP backends — the tokens Agent Gateway injects.
#
# REFERENCE ONLY: this file deliberately contains no objects. install.sh creates both Secrets from
# WRITER_PAT / REVIEWER_PAT (see create_github_secrets), so a token is never committed, and neither
# install.sh nor `kubectl apply -f github/` can overwrite a real token with a placeholder.
#
# ONE SECRET PER AGENT, so each agent gets a DIFFERENT credential set (the core teaching goal):
#   * writer  -> a PAT scoped to open PRs / comment (e.g. repo or public_repo)
#   * reviewer-> a PAT additionally able to approve + merge PRs
# Each secret is referenced by that agent's AgentgatewayBackend (github-mcp-backend.yaml). Neither
# token is ever mounted into any agent workload — they live only in the gateway namespace.
#
# To create or rotate them by hand (the key MUST be `Authorization`, the value `Bearer <token>`):
#   kubectl -n agentgateway-system create secret generic github-mcp-writer-credential \
#     --from-literal=Authorization="Bearer <writer-pat>" --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n agentgateway-system create secret generic github-mcp-reviewer-credential \
#     --from-literal=Authorization="Bearer <reviewer-pat>" --dry-run=client -o yaml | kubectl apply -f -
# The gateway reads them at config time — after a rotation:
#   kubectl -n agentgateway-system rollout restart deploy/egress
#
# RBAC-restrict read access to these secrets to the Agent Gateway controller/proxy ServiceAccount only.
