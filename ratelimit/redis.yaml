# Redis — the backing store for the rate limit service.
#
# The Envoy reference rate limit service keeps its per-descriptor counters in Redis, so the counts
# survive rate-limit-service restarts and can (with more replicas) be shared. This is a single,
# ephemeral replica sized for the walkthrough — for production use a managed/HA Redis and pin a
# specific image digest rather than a floating tag.
#
# The rate limit Deployment reaches this via REDIS_URL=redis:6379 (redis.yaml Service below),
# resolved within the ratelimit namespace.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ratelimit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ratelimit
spec:
  selector:
    app: redis
  ports:
    - port: 6379
